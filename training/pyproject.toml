[project]
name = "mnist-mlp"
version = "0.1.0"
description = "Minimal MLP for MNIST classification"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# Tell uv to fetch PyTorch packages from the CUDA index
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tests*"]
